[package]
name = "jorik-cli"
version = "0.5.0-dev.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored_json = "5.0"
colored = "2.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
semver = "1.0"
sha2 = "0.10"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
getrandom = "0.3"
httparse = "1.10"
libc = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
tempfile = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "process"] }
dirs = "5.0"
open = "5.1"

# image/graphics rendering dependencies for --version logo
image = "0.25"
base64 = "0.21"
icy_sixel = "0.4"
terminal_size = "0.3"
ratatui-image = { version = "10.0.2", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui = "0.30"
atty = "0.2"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.31"
url = "2.5.8"
chrono = "0.4.43"

[build-dependencies]
winres = "0.1"
