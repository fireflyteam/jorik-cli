name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject mismatched release tags before building or signing
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo '::error::Release tag must match Cargo.toml version'
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && ! -s "docs/releases/$VERSION.md" ]]; then
            echo '::error::Release notes are required in docs/releases/<version>.md'
            exit 1
          fi

  quality:
    uses: ./.github/workflows/check.yml

  build-linux:
    name: build (Linux x64)
    needs: [validate, quality]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      BIN_NAME: jorik-cli
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ runner.os }}-${{ env.TARGET }}
      - run: cargo build --release --locked --target ${{ env.TARGET }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BIN_NAME" dist/jorik
          tar -C dist -czf "dist/jorik-$TARGET.tar.gz" jorik
      - name: Sign build provenance
        if: startsWith(github.ref, 'refs/tags/')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Verify and retain signed provenance
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$BUNDLE_PATH" dist/linux.sigstore.json
          gh attestation verify "dist/jorik-$TARGET.tar.gz" --bundle "$BUNDLE_PATH" \
            --hostname github.com --repo fireflyteam/jorik-cli \
            --cert-identity "https://github.com/fireflyteam/jorik-cli/.github/workflows/build.yml@$GITHUB_REF" \
            --source-ref "$GITHUB_REF" --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners --digest-alg sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.BIN_NAME }}-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.sigstore.json

  build-windows:
    name: build (Windows x64)
    needs: [validate, quality]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    env:
      BIN_NAME: jorik-cli
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ runner.os }}-${{ env.TARGET }}
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Get version
        shell: pwsh
        run: |
          $versionLine = Get-Content Cargo.toml | Where-Object { $_ -match '^version' } | Select-Object -First 1
          $version = ($versionLine -split '"')[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }}
      - name: Package binary and installer
        shell: pwsh
        run: |
          $src = "target\$env:TARGET\release\jorik-cli.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src "dist\jorik.exe" -Force
          Compress-Archive -Path "dist\jorik.exe" -DestinationPath "dist\jorik-$env:TARGET.zip" -Force
          Copy-Item $src "target\$env:TARGET\release\jorik.exe" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "/DMyTarget=$env:TARGET" installer\jorik-cli.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign build provenance
        if: startsWith(github.ref, 'refs/tags/')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*setup.exe
      - name: Verify and retain signed provenance
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination dist/windows.sigstore.json
          Get-ChildItem dist/*.zip, dist/*setup.exe | ForEach-Object {
            gh attestation verify $_.FullName --bundle $env:BUNDLE_PATH --hostname github.com --repo fireflyteam/jorik-cli --cert-identity "https://github.com/fireflyteam/jorik-cli/.github/workflows/build.yml@$env:GITHUB_REF" --source-ref $env:GITHUB_REF --cert-oidc-issuer https://token.actions.githubusercontent.com --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners --digest-alg sha256
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.BIN_NAME }}-${{ env.TARGET }}
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/*.sigstore.json

  release:
    permissions:
      contents: write
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo 'IS_PRERELEASE=true' >> "$GITHUB_ENV"; else echo 'IS_PRERELEASE=false' >> "$GITHUB_ENV"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify packages again before publication
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in *.tar.gz *.zip *setup.exe; do
            if [[ "$file" == *.tar.gz ]]; then bundle=linux.sigstore.json; else bundle=windows.sigstore.json; fi
            gh attestation verify "$file" --bundle "$bundle" --hostname github.com --repo fireflyteam/jorik-cli \
              --cert-identity "https://github.com/fireflyteam/jorik-cli/.github/workflows/build.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners --digest-alg sha256
          done
          sha256sum -- *.tar.gz *.zip *setup.exe > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*setup.exe
            artifacts/*.sigstore.json
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ env.IS_PRERELEASE }}
          name: Release v${{ env.VERSION }}
          body_path: docs/releases/${{ env.VERSION }}.md
          generate_release_notes: true
