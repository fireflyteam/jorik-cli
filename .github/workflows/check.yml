name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Bootstrap regression tests
        if: runner.os == 'Linux'
        run: |
          bash -n installer/install.sh installer/update-prerelease.sh
          python3 -B -m unittest discover -s installer/tests -v
      - name: Native Windows credential-store round trip
        if: runner.os == 'Windows'
        run: cargo test --locked credentials::tests::native_credential_store_round_trip -- --ignored
      - name: Native macOS credential-store round trip (disposable keychain)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/jorik-test.keychain-db"
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          trap 'security delete-keychain "$KEYCHAIN"' EXIT
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          cargo test --locked credentials::tests::native_credential_store_round_trip -- --ignored
      - name: Native Linux Secret Service round trip (disposable login keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
          dbus-run-session -- bash -euc '
            export XDG_DATA_HOME=$(mktemp -d)
            trap '\''rm -rf "$XDG_DATA_HOME"'\'' EXIT
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked credentials::tests::native_credential_store_round_trip -- --ignored
          '
      - name: Unavailable Linux store fails closed without plaintext fallback
        if: runner.os == 'Linux'
        run: |
          XDG_CONFIG_HOME=$(mktemp -d)
          export XDG_CONFIG_HOME
          trap 'rm -rf "$XDG_CONFIG_HOME"' EXIT
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/nonexistent-jorik-bus"
          export JORIK_TEST_UNAVAILABLE_STORE=1
          cargo test --locked credentials::tests::native_unavailable_store_fails_closed -- --ignored
